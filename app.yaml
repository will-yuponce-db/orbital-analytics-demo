# Databricks Apps runs `npm install` from package.json (runtime deps only),
# then this command. Client is prebuilt in dist/, server in server/dist/.
command:
  - "node"
  - "server/dist/server/index.js"

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "8000"
  - name: PGHOST
    value: "ep-steep-meadow-d2vuhdb5.database.us-east-1.cloud.databricks.com"
  - name: PGPORT
    value: "5432"
  - name: PGDATABASE
    value: "orbitwatch"
  - name: PGSSLMODE
    value: "require"
  - name: PG_AUTH_MODE
    value: "sp"
  - name: CHAT_MODEL
    value: "databricks-claude-sonnet-5-5"
